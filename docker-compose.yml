  frontend:
    build:
      context: ./frontend
      target: development
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules           # exclude — installed in container
      - /app/.nuxt
    env_file: ./frontend/.env.local
    command: npm run dev
    depends_on: [backend]
    restart: unless-stopped

