# docker-compose.yml
version: '3.9'

services:

  backend:
    build:
      context: ./backend
      target: development           # multi-stage build target
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app              # hot reload — edit locally, runs in container
      - /app/__pycache__            # exclude pycache from mount
    env_file: ./backend/.env.local
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules           # exclude — installed in container
      - /app/.nuxt
    env_file: ./frontend/.env.local
    command: npm run dev
    depends_on: [backend]
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    environment:
      POSTGRES_DB:       lakhimpur_dev
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: devpassword
    ports: ["5432:5432"]
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout:  5s
      retries:  10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes: ["./data/redis:/data"]
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  5s
      retries:  5
    restart: unless-stopped

  mailpit:                          # optional: catches dev emails
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
    restart: unless-stopped