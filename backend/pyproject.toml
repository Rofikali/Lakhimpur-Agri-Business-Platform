[project]
name = "lakhimpur-biz"
version = "0.1.0"
description = "Modern scalable ecommerce backend"
requires-python = ">=3.12"

dependencies = [
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    # Redis
    "redis[hiredis]>=5.0.4",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.7",
    # Settings
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",
    # Payments
    "razorpay>=1.4.1",
    # HTTP
    "httpx>=0.27.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Monitoring
    "sentry-sdk[fastapi]>=2.3.1",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Scheduling
    "apscheduler>=3.10.4",
    # Extras
    "orjson>=3.10.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "greenlet>=3.0.3",
    "pytest>=9.0.3",
    "psycopg2>=2.9.12",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "faker>=25.2.0",
    "pytest-xdist>=3.6.1",
    "pytest-timeout>=2.3.1",

    # Quality
    "ruff>=0.4.4",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",

    # Type stubs
    "types-passlib",

    # Dev UX
    "rich>=13.7.1",
    "ipython>=8.24.0",
    "watchfiles>=0.22.0",
]

# =========================================================
# RUFF
# =========================================================

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = ["migrations/", ".venv/", "build/", "dist/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =========================================================
# BLACK
# =========================================================

[tool.black]
line-length = 100
target-version = ["py312"]

exclude = """
/(
    migrations
    | .venv
    | build
    | dist
)/
"""

# =========================================================
# PYTEST
# =========================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"

testpaths = ["tests"]

filterwarnings = ["ignore::DeprecationWarning"]

python_files = ["test_*.py"]

# =========================================================
# COVERAGE
# =========================================================
[tool.coverage.run]
source = ["modules", "shared", "core"]
omit = ["*/migrations/*", "*/tests/*", "scripts/*", "*/conftest*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

# =========================================================
# MYPY
# =========================================================

[tool.mypy]
python_version = "3.12"

# Core behavior
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true

# Imports
ignore_missing_imports = true
explicit_package_bases = true

# Safety
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Project structure
namespace_packages = true

exclude = ["migrations/", ".venv/", "build/", "dist/"]

# =========================================================
# HATCH BUILD SYSTEM
# =========================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "core/**/*.py",
    "shared/**/*.py",
    "migrations/**/*.py",
    "scripts/**/*.py",
    "main.py",
]
